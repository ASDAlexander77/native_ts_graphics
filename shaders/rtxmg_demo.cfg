// rtxmg_demo's shaders, compiled in place from RTXMG_DIR/demo (--sourceDir): the path tracer (the
// cluster-tessellation permutation: shading normals from the limit surface, no cluster-LOD shading),
// the pose interpolation, the HiZ prepass and the blit. Motion vectors are DLSS's only: not built.
shaders/blit.hlsl -T cs
shaders/lerp_keyframes.hlsl -T cs
shaders/rtxmg_demo_path_tracer.hlsl -T lib --compilerOptionsSPIRV "-fvk-bind-resource-heap 0 1" -D VERTEX_NORMALS=0 -D CLUSTER_LOD_SHADING=0
shaders/zrender.hlsl -T lib
// D3D12's DXR clusters (NVRHI_D3D12_WITH_DXRCLUSTER): the path tracer with shader model 6.10's ClusterID()
// and TriangleObjectPositions() (the preview DXC), as RTXMG's demo/shaders.cfg builds it.
#ifdef NVRHI_D3D12_WITH_DXRCLUSTER
shaders/rtxmg_demo_path_tracer.hlsl -T lib -m 6_10 -s _dxr --compilerOptionsDXIL "-disable-payload-qualifiers -D DONUT_CLUSTER_API_DXR=1" -D VERTEX_NORMALS=0 -D CLUSTER_LOD_SHADING=0
#endif
