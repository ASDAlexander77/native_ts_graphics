// The precompiled shaders of rtxpt (examples/rtxpt.ts): RTXPT_DIR/Rtxpt's, compiled in place
// (--sourceDir), the ones its reference path tracer's passes create through the ShaderFactory. The path
// tracer itself compiles at run time (ShaderDynamic/, see CMakeLists.txt).
Misc/DebugLines.hlsl -T vs -E main_vs -D DRAW_LINES_SHADERS_OLD=1
Misc/DebugLines.hlsl -T ps -E main_ps -D DRAW_LINES_SHADERS_OLD=1
Shaders/TLASCull.hlsl -T cs -E main
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T vs -E main_vs -D DRAW_TRIANGLES_SHADERS=1
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T ps -E main_ps -D DRAW_TRIANGLES_SHADERS=1
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T vs -E main_vs -D DRAW_LINES_SHADERS=1
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T ps -E main_ps -D DRAW_LINES_SHADERS=1
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T ps -E main -D BLEND_DEBUG_BUFFER=1
Shaders/Libraries/ShaderDebug/ShaderDebug.hlsl -T cs -E main_cs -D COPY_GEOMETRY_FOR_OUTPUT=1
ProcessingPasses/ExportVisibilityBuffer.hlsl -T cs -E main
ProcessingPasses/SubSamplingCompaction.hlsl -T cs -E main
ProcessingPasses/AccumulationPass.hlsl -T cs -E main
// PostProcess and DenoisingGuidesBaker create all their passes, the real-time mode's too.
ProcessingPasses/PostProcess.hlsl -T cs -E main -D DENOISING_LAYERS_DEBUG_VIZ=1
ProcessingPasses/PostProcess.hlsl -T cs -E main -D DENOISER_PREPARE_INPUTS=1 -D USE_RELAX={0,1}
ProcessingPasses/PostProcess.hlsl -T cs -E main -D DENOISER_FINAL_MERGE=1 -D USE_RELAX={0,1}
ProcessingPasses/PostProcess.hlsl -T cs -E main -D NO_DENOISER_FINAL_MERGE=1
ProcessingPasses/PostProcess.hlsl -T cs -E main -D DUMMY_PLACEHOLDER_EFFECT=1
ProcessingPasses/DenoisingGuidesBaker.hlsl -T cs -E PrepareDLSSRRGuides
ProcessingPasses/DenoisingGuidesBaker.hlsl -T cs -E DenoiseSpecHitT
ProcessingPasses/DenoisingGuidesBaker.hlsl -T cs -E ComputeAvgLayerRadiance
ProcessingPasses/DenoisingGuidesBaker.hlsl -T cs -E DebugViz
ToneMapper/ToneMapping.hlsl -T ps -E main_ps
ToneMapper/ToneMapping.hlsl -T cs -E capture_cs
ToneMapper/luminance_ps.hlsl -T ps -E main
Lighting/Distant/EnvMapBaker.hlsl -T cs -E LowResPrePassLayerCS
Lighting/Distant/EnvMapBaker.hlsl -T cs -E BaseLayerCS
Lighting/Distant/EnvMapBaker.hlsl -T cs -E MIPReduceCS
Lighting/Distant/EnvMapImportanceSamplingBaker.hlsl -T cs -E BuildMIPDescentImportanceMapCS
Lighting/Distant/BC6UCompress.hlsl -T cs -E CSMain -D QUALITY=0
Lighting/Distant/BC6UCompress.hlsl -T cs -E CSMain -D QUALITY=1
Lighting/Distant/BRDFLUTGenerator.hlsl -T cs -E main
Shaders/Libraries/LightsBaker/CubemapProcessing.hlsl -T cs -E GGXPrefilterCS
Shaders/Libraries/LightsBaker/CubemapProcessing.hlsl -T cs -E ConvolveIrradianceCS
